# Committed, non-secret defaults. Secrets (ORS_KEY, REALTYAPI_KEY) come from
# the real process environment, which wins over this file; a missing secret fails
# fast at startup via bean validation in IsochroneHomefinderConfiguration.

server.port=8080

# Spring renders controller exceptions (its own and our ErrorResponse types in the
# `error` package) as RFC 9457 ProblemDetail. This also registers Boot's
# ProblemDetailsExceptionHandler, so we do not hand-roll an advice.
spring.mvc.problemdetails.enabled=true

# Offline demo mode (no external API traffic — useful when ORS/realtyapi are at quota
# or unset). Activate the `offline` profile; it swaps in canned geocoding, an enclosing
# isochrone region, and cached/synthetic homes, and needs no API keys:
#   SPRING_PROFILES_ACTIVE=offline
# In the default (live) mode, ORS_KEY and REALTYAPI_KEY are required.

# Per-client read timeouts. Overridable via env (relaxed binding):
#   ORS_TIMEOUT, REALTYAPI_TIMEOUT
ors.timeout=15s
realtyapi.timeout=30s
